name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.charts.outputs.charts }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run helm-docs
        uses: losisin/helm-docs-github-action@9e0787c426fdec38be6288bb5c0559dcb388412c # v2.0.1

      - name: Stage helm-docs changes
        run: git add --all charts

      - name: Commit helm-docs changes
        uses: xxczaki/actions/commit-via-api@2055f70b487aac8d86315ce4eb26028931f60cd6 # v1.0.0
        with:
          token: ${{ github.token }}
          message: update Helm documentation
          sync-checkout: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v5
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Add helm dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Run chart-releaser
        id: cr
        uses: helm/chart-releaser-action@v1.9.0
        with:
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Collect released charts
        id: charts
        env:
          CHANGED_CHARTS: ${{ steps.cr.outputs.changed_charts }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            CHANGED_CHARTS=$(find charts -mindepth 1 -maxdepth 1 -type d | sort | paste -sd, -)
          fi
          echo "charts=$(jq --compact-output --null-input --arg charts "$CHANGED_CHARTS" '$charts | split(",") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
          if compgen -G ".cr-release-packages/*.tgz" > /dev/null; then
            echo "packaged=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest release packages
        if: steps.charts.outputs.packaged == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .cr-release-packages/*.tgz
          create-storage-record: false

  oci:
    needs: [release]
    if: needs.release.outputs.charts != '[]'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJSON(needs.release.outputs.charts) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@v5
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Package chart
        id: package
        env:
          CHART: ${{ matrix.chart }}
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm dependency build "$CHART"
          helm package "$CHART" --destination dist
          echo "name=$(yq '.name' "$CHART/Chart.yaml")" >> "$GITHUB_OUTPUT"

      - name: Push to GHCR
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if ! output=$(helm push dist/*.tgz oci://ghcr.io/xxczaki/charts 2>&1); then
            echo "$output"
            exit 1
          fi
          echo "$output"
          echo "digest=$(awk '/^Digest:/ {print $2}' <<< "$output")" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR for attestation push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Attest OCI chart
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/xxczaki/charts/${{ steps.package.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
