apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wicek.fullname" . }}
  labels:
    {{- include "wicek.labels" . | nindent 4 }}
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "wicek.selectorLabels" . | nindent 6 }}
  revisionHistoryLimit: 3
  template:
    metadata:
      labels:
        {{- include "wicek.labels" . | nindent 8 }}
      {{- if or .Values.ssh.knownHosts .Values.broker.enabled }}
      annotations:
        {{- if .Values.ssh.knownHosts }}
        checksum/known-hosts: {{ .Values.ssh.knownHosts | sha256sum }}
        {{- end }}
        {{- if .Values.broker.enabled }}
        checksum/broker-config: {{ .Values.broker.hosts | toJson | sha256sum }}
        {{- end }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: 15
      serviceAccountName: {{ include "wicek.serviceAccountName" . }}
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        - name: install-gh
          image: alpine:3
          command:
            - sh
            - -c
            - |
              wget -qO- "https://github.com/cli/cli/releases/download/v{{ .Values.initContainers.ghCli.version }}/gh_{{ .Values.initContainers.ghCli.version }}_linux_arm64.tar.gz" |
              tar xz --strip-components=2 -C /extra-bin "gh_{{ .Values.initContainers.ghCli.version }}_linux_arm64/bin/gh"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: extra-bin
              mountPath: /extra-bin
        {{- if .Values.broker.enabled }}
        - name: broker
          image: "{{ .Values.broker.image.repository }}:{{ .Values.broker.image.tag | default .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          restartPolicy: Always
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: BROKER_CONFIG
              value: /etc/broker/config.json
            - name: BROKER_PORT
              value: "{{ .Values.broker.port }}"
            {{- if .Values.broker.sshKeys }}
            - name: SSH_AUTH_SOCK
              value: /run/ssh-agent/agent.sock
            - name: SSH_KEY_FILES
              value: {{ join " " .Values.broker.sshKeys | quote }}
            {{- end }}
          startupProbe:
            exec:
              command:
                - python3
                - -c
                - "import socket; socket.create_connection(('127.0.0.1', {{ .Values.broker.port }}), 1)"
            periodSeconds: 1
            failureThreshold: 60
          volumeMounts:
            - name: broker-config
              mountPath: /etc/broker
              readOnly: true
            - name: broker-state
              mountPath: /run/broker-state
            - name: broker-ca
              mountPath: /run/broker-ca
            {{- range .Values.broker.secrets }}
            - name: broker-secret-{{ .name }}
              mountPath: /run/broker/{{ .name }}
              readOnly: true
            {{- end }}
            {{- if .Values.broker.sshKeys }}
            - name: ssh-agent
              mountPath: /run/ssh-agent
            {{- end }}
          {{- with .Values.broker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: webhooks
              containerPort: {{ .Values.webhooks.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: webhooks
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: webhooks
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          env:
            - name: DISCORD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.discordToken.name }}
                  key: {{ .Values.secrets.discordToken.key }}
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.oauthToken.name }}
                  key: {{ .Values.secrets.oauthToken.key }}
            - name: CLIENT_ID
              value: "{{ .Values.env.clientId }}"
            - name: ALLOWED_USER_IDS
              value: "{{ .Values.env.allowedUserIds }}"
            - name: DATA_DIR
              value: "/data"
            - name: HOME
              value: "/home/node"
            - name: NODE_ENV
              value: "production"
            - name: APP_VERSION
              value: "{{ .Chart.Version }}"
            - name: WEBHOOK_PORT
              value: "{{ .Values.webhooks.port }}"
            {{- if .Values.readers }}
            - name: READERS
              value: {{ include "wicek.readers" . | quote }}
            {{- end }}
            {{- if .Values.broker.enabled }}
            {{- $proxy := printf "http://127.0.0.1:%v" .Values.broker.port }}
            {{- $readerHosts := list }}
            {{- range (include "wicek.readers" . | fromJsonArray) }}
            {{- $readerHosts = append $readerHosts .host }}
            {{- end }}
            {{- $noProxy := join "," (concat (list "localhost" "127.0.0.1") .Values.broker.noProxy $readerHosts) }}
            {{- range $name := list "HTTP_PROXY" "http_proxy" "HTTPS_PROXY" "https_proxy" }}
            - name: {{ $name }}
              value: {{ $proxy | quote }}
            {{- end }}
            {{- range $name := list "NO_PROXY" "no_proxy" }}
            - name: {{ $name }}
              value: {{ $noProxy | quote }}
            {{- end }}
            - name: NODE_USE_ENV_PROXY
              value: "1"
            - name: NODE_EXTRA_CA_CERTS
              value: /run/broker-ca/ca.pem
            {{- range $name := list "SSL_CERT_FILE" "CURL_CA_BUNDLE" "GIT_SSL_CAINFO" "REQUESTS_CA_BUNDLE" }}
            - name: {{ $name }}
              value: /run/broker-ca/bundle.pem
            {{- end }}
            {{- if .Values.broker.sshKeys }}
            - name: SSH_AUTH_SOCK
              value: /run/ssh-agent/agent.sock
            {{- end }}
            {{- end }}
            {{- if and .Values.secrets.githubWebhookSecret.name .Values.secrets.githubWebhookSecret.key }}
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.githubWebhookSecret.name }}
                  key: {{ .Values.secrets.githubWebhookSecret.key }}
            {{- end }}
            {{- if and .Values.secrets.grafanaWebhookToken.name .Values.secrets.grafanaWebhookToken.key }}
            - name: GRAFANA_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.grafanaWebhookToken.name }}
                  key: {{ .Values.secrets.grafanaWebhookToken.key }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: claude-state
              mountPath: /home/node/.claude
            - name: extra-bin
              mountPath: /usr/local/bin/gh
              subPath: gh
              readOnly: true
            {{- if .Values.broker.enabled }}
            - name: broker-ca
              mountPath: /run/broker-ca
              readOnly: true
            {{- if .Values.broker.sshKeys }}
            - name: ssh-agent
              mountPath: /run/ssh-agent
            {{- end }}
            {{- end }}
            {{- if .Values.ssh.knownHosts }}
            - name: ssh-known-hosts
              mountPath: /etc/ssh/ssh_known_hosts
              subPath: ssh_known_hosts
              readOnly: true
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if .Values.chromium.enabled }}
        - name: chromium
          image: {{ .Values.chromium.image }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          {{- with .Values.chromium.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "wicek.fullname" . }}
        - name: claude-state
          persistentVolumeClaim:
            claimName: {{ include "wicek.fullname" . }}-claude
        - name: extra-bin
          emptyDir: {}
        {{- if .Values.ssh.knownHosts }}
        - name: ssh-known-hosts
          configMap:
            name: {{ include "wicek.fullname" . }}-ssh-known-hosts
        {{- end }}
        {{- if .Values.broker.enabled }}
        - name: broker-config
          configMap:
            name: {{ include "wicek.fullname" . }}-broker
        - name: broker-state
          emptyDir:
            medium: Memory
        - name: broker-ca
          emptyDir: {}
        {{- range .Values.broker.secrets }}
        - name: broker-secret-{{ .name }}
          secret:
            secretName: {{ .secretName }}
            defaultMode: 0440
        {{- end }}
        {{- if .Values.broker.sshKeys }}
        - name: ssh-agent
          emptyDir:
            medium: Memory
        {{- end }}
        {{- end }}
