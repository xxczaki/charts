{{- if .Values.webhooks.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "wicek.fullname" . }}
  labels:
    {{- include "wicek.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "wicek.selectorLabels" . | nindent 4 }}
  ports:
    - name: webhooks
      port: {{ .Values.webhooks.port }}
      targetPort: webhooks
      protocol: TCP
{{- end }}
