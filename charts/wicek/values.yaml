secrets:
  # -- Points to a Secret containing the Claude Code OAuth token
  # Generated via `claude setup-token`
  # @section -- Authentication
  oauthToken:
    name: ""
    key: ""
  # -- Points to a Secret containing the Discord bot token
  # @section -- Authentication
  discordToken:
    name: ""
    key: ""
  # -- Points to a Secret containing the GitHub webhook secret (X-Hub-Signature-256)
  # When unset, GITHUB_WEBHOOK_SECRET is not injected and /hooks/github returns 404.
  # @section -- Webhooks
  githubWebhookSecret:
    name: ""
    key: ""
  # -- Points to a Secret containing the Grafana webhook bearer token
  # When unset, GRAFANA_WEBHOOK_TOKEN is not injected and /hooks/grafana returns 404.
  # @section -- Webhooks
  grafanaWebhookToken:
    name: ""
    key: ""
env:
  # -- Discord application client ID
  # @section -- Bot
  clientId: ""
  # -- Comma-separated Discord user IDs allowed to interact
  # @section -- Bot
  allowedUserIds: ""
webhooks:
  # -- Port of the webhook HTTP server (/hooks/github, /hooks/grafana, /healthz)
  # @section -- Webhooks
  port: 8080
  service:
    # -- Expose the webhook port as a ClusterIP Service and allow ingress to it
    # from the Tailscale namespace
    # @section -- Webhooks
    enabled: false
  ingress:
    # -- Create a Tailscale Ingress exposing only /hooks (requires webhooks.service.enabled)
    # @section -- Webhooks
    enabled: false
    # -- Tailnet hostname of the ingress (becomes <hostname>.<tailnet>.ts.net)
    # @section -- Webhooks
    hostname: wicek-hooks
    # -- Expose the ingress publicly via Tailscale Funnel (tailscale.com/funnel annotation)
    # @section -- Webhooks
    funnel: true
broker:
  # -- Run the credential broker sidecar (mitmproxy). Service credentials are mounted only
  # into it; the agent container sends its traffic through it via HTTP(S)_PROXY, trusts its
  # CA, and uses placeholder credentials that the broker replaces for listed hosts.
  # @section -- Broker
  enabled: false
  image:
    # -- Broker image repository
    # @section -- Broker
    repository: ghcr.io/xxczaki/wicek-broker
    # -- Broker image tag (defaults to image.tag, both are built from the same commit)
    # @section -- Broker
    tag: ""
  # -- Port the broker listens on (127.0.0.1 only)
  # @section -- Broker
  port: 3128
  # -- Secrets mounted read-only into the broker at /run/broker/<name>/, e.g.
  # `[{name: grafana-cloud, secretName: grafana-cloud}]`
  # @section -- Broker
  secrets: []
  # -- Hosts the broker intercepts and how it authenticates to them, rendered to
  # /etc/broker/config.json (see the wicek README for the format)
  # @section -- Broker
  hosts: []
  # -- SSH private key files (under /run/broker/) to load into ssh-agent.
  # When set, the agent container gets SSH_AUTH_SOCK instead of a key.
  # @section -- Broker
  sshKeys: []
  # -- Hosts that bypass the broker (NO_PROXY), in addition to localhost
  # @section -- Broker
  noProxy:
    - .anthropic.com
    - .claude.ai
    - .claude.com
    - .discord.com
    - .discord.gg
    - .discordapp.com
  # -- Placeholder environment variables for the agent container, for tools that refuse to
  # run without a credential (e.g. `GH_TOKEN: injected-by-broker`)
  # @section -- Broker
  placeholderEnv: {}
  resources:
    requests:
      memory: "64Mi"
      cpu: "10m"
    limits:
      memory: "256Mi"
      cpu: "300m"
image:
  repository: ghcr.io/xxczaki/wicek
  pullPolicy: Always
  tag: "c11abe2b029f78eebf78ce89859333db473cc474"
ssh:
  # -- SSH known_hosts entries (`host keytype key`, one per line), mounted at
  # /etc/ssh/ssh_known_hosts so host keys are trusted across redeploys. Get them
  # with `ssh-keyscan <host>`. When empty, no file is mounted.
  # @section -- SSH
  knownHosts: ""
serviceAccount:
  create: true
  annotations: {}
  name: ""
persistence:
  # -- Size of the persistent volume for Claude Code state and app data
  # @section -- Storage
  size: "5Gi"
  accessModes:
    - ReadWriteOnce
  storageClass: ""
securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault
resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "1Gi"
    cpu: "500m"
initContainers:
  ghCli:
    # -- GitHub CLI version to install
    # @section -- Init Containers
    version: "2.87.3"
chromium:
  # -- Enable headless Chrome sidecar for browser automation
  # @section -- Browser
  enabled: false
  image: chromedp/headless-shell:stable
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
networkPolicy:
  # -- Restrict pod traffic (the bot is outbound-only; ingress is always denied)
  # @section -- Network Policy
  enabled: true
  # -- Policy provider: "standard" (portable, port-based NetworkPolicy) or
  # "cilium" (DNS-aware FQDN egress allowlist with default-deny; requires the
  # Cilium CNI). Use "cilium" to restrict egress to specific domains.
  # @section -- Network Policy
  provider: standard
  # -- Extra TCP egress ports, e.g. 993 for the broker's IMAP mail gateway. "standard" allows them to any host,
  # "cilium" only to allowedFQDNs and allowedCIDRs.
  # @section -- Network Policy
  extraEgressPorts: []
  tailscale:
    # -- Allow egress to a Tailscale namespace (SSH and sidecar service ports). Applies to both providers.
    # @section -- Network Policy
    enabled: true
    # -- Namespace running the Tailscale operator/egress proxies
    # @section -- Network Policy
    namespace: tailscale
    # -- Ports allowed to Tailscale destinations
    # @section -- Network Policy
    ports:
      - 22
      - 8123
  cilium:
    # -- Domains the agent may reach over HTTPS. Everything else is denied (provider "cilium" only).
    # @section -- Network Policy
    allowedFQDNs: []
    # -- CIDRs the agent may reach over HTTPS, e.g. a LAN controller (provider "cilium" only).
    # @section -- Network Policy
    allowedCIDRs: []
